# Fallback only: JobScan.xcodeproj is already included. If Xcode ever refuses to
# open it, regenerate it with XcodeGen:
#   brew install xcodegen && xcodegen generate
name: JobScan
options:
  bundleIdPrefix: dev.jobscan
  deploymentTarget:
    iOS: "17.0"
packages:
  JobScanCore:
    path: JobScanCore
targets:
  JobScan:
    type: application
    platform: iOS
    sources:
      - path: JobScan
    dependencies:
      - package: JobScanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jobscan.JobScan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: JobScan-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Job Scan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
